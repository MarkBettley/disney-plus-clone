<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney+ Clone | Series</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="index.html" class="logo-link">
                    <i class="fab fa-disney"></i>
                    <span class="logo-text">DISNEY+ CLONE</span>
                </a>
            </div>
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Inicio</a></li>
                    <li class="nav__item"><a href="series.html" class="nav__link nav__link--active">Series</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero__content">
                <h1 class="hero__title">SERIES POPULARES</h1>
                <p class="hero__subtitle">Las series más vistas del momento</p>
            </div>
        </section>

        <section class="series">
            <div class="container">
                <h2 class="section-title">Series destacadas</h2>
                <div id="series-container" class="series-grid">
                    <div class="loading">Cargando series...</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__col">
                <h4>Disney+ Clone</h4>
                <ul><li><a href="#">Acerca de</a></li><li><a href="#">Términos</a></li></ul>
            </div>
            <div class="footer__col">
                <h4>API</h4>
                <ul><li><a href="https://www.tvmaze.com/api" target="_blank">TVMaze API</a></li></ul>
            </div>
        </div>
        <div class="footer__bottom">
            <p>&copy; 2025 Disney+ Clone - Proyecto educativo con Vanilla JS y Axios</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
